<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">What Abhiram is exploring</title><desc id="desc">AI-assisted engineering, context-aware agents, observability, infrastructure, and approachable full-stack products.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a16"/><stop offset="1" stop-color="#180d20"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff6b35"/></linearGradient></defs><rect width="1200" height="390" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="url(#a)" stroke-width="2" stroke-opacity=".6"/><text x="58" y="66" fill="#34d399" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">CURRENT SIGNAL</text><text x="58" y="108" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800">What I’m exploring</text><g font-family="ui-sans-serif,system-ui,sans-serif"><g transform="translate(58 148)"><circle cx="12" cy="13" r="8" fill="#8b5cf6"/><text x="36" y="18" fill="#f3f4f6" font-size="19" font-weight="700">AI-assisted engineering</text><text x="36" y="45" fill="#9ca3af" font-size="15">Rapid iteration paired with clear specs and meaningful tests.</text></g><g transform="translate(58 225)"><circle cx="12" cy="13" r="8" fill="#34d399"/><text x="36" y="18" fill="#f3f4f6" font-size="19" font-weight="700">Context-aware agents</text><text x="36" y="45" fill="#9ca3af" font-size="15">MCP-connected tools and human-in-the-loop workflows.</text></g><g transform="translate(626 148)"><circle cx="12" cy="13" r="8" fill="#ff6b35"/><text x="36" y="18" fill="#f3f4f6" font-size="19" font-weight="700">Observable infrastructure</text><text x="36" y="45" fill="#9ca3af" font-size="15">Making complex systems easier to understand and operate.</text></g><g transform="translate(626 225)"><circle cx="12" cy="13" r="8" fill="#38bdf8"/><text x="36" y="18" fill="#f3f4f6" font-size="19" font-weight="700">Approachable products</text><text x="36" y="45" fill="#9ca3af" font-size="15">Turning useful ideas into thoughtful full-stack experiences.</text></g></g><path d="M58 328h1084" stroke="url(#a)"/><text x="600" y="358" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace,monospace" font-size="14">curiosity is part of the architecture</text></svg>