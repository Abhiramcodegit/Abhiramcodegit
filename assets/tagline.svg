<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
  <title id="title">Abhiram's engineering philosophy</title>
  <desc id="desc">Building useful software, exploring intelligent systems, and sharing what I learn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a0c18"/>
      <stop offset=".5" stop-color="#100d20"/>
      <stop offset="1" stop-color="#1b100f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="92" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="90" rx="19" fill="none" stroke="url(#line)" stroke-opacity=".58" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="1.15">
    <g transform="translate(48 25)">
      <rect width="330" height="42" rx="21" fill="#8b5cf6" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".48"/>
      <circle cx="25" cy="21" r="5" fill="#a78bfa"/>
      <text x="43" y="27" fill="#ddd6fe">BUILDING USEFUL SOFTWARE</text>
    </g>
    <g transform="translate(435 25)">
      <rect width="330" height="42" rx="21" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".42"/>
      <circle cx="25" cy="21" r="5" fill="#34d399"/>
      <text x="43" y="27" fill="#a7f3d0">EXPLORING INTELLIGENT SYSTEMS</text>
    </g>
    <g transform="translate(822 25)">
      <rect width="330" height="42" rx="21" fill="#ff6b35" fill-opacity=".11" stroke="#ff6b35" stroke-opacity=".46"/>
      <circle cx="25" cy="21" r="5" fill="#ff6b35"/>
      <text x="43" y="27" fill="#fed7c7">SHARING WHAT I LEARN</text>
    </g>
  </g>
</svg>
