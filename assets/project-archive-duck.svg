<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="title desc">
  <title id="title">The Abhi Archive</title>
  <desc id="desc">Abhiram's portfolio and technical blog, represented by a bright rubber duck.</desc>
  <defs>
    <linearGradient id="a" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="duck" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff45c"/><stop offset=".58" stop-color="#ffd91a"/><stop offset="1" stop-color="#f5ad00"/></linearGradient>
    <linearGradient id="beak" x1="0" x2="1"><stop stop-color="#ff9a35"/><stop offset="1" stop-color="#f4511e"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="268" rx="22" fill="#090b17" stroke="url(#a)" stroke-width="2"/>
  <text x="28" y="42" fill="#f0abfc" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">PORTFOLIO + TECHNICAL WRITING</text>
  <text x="28" y="86" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="31" font-weight="800">The Abhi Archive</text>
  <text x="28" y="120" fill="#d1d5db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">A home for projects, experiments, engineering</text>
  <text x="28" y="143" fill="#d1d5db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">notes, and ideas about the future of software.</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="28" y="172" width="73" height="27" rx="13" fill="#38bdf8" fill-opacity=".15"/><text x="64" y="190" text-anchor="middle" fill="#7dd3fc">Next.js</text>
    <rect x="109" y="172" width="67" height="27" rx="13" fill="#8b5cf6" fill-opacity=".18"/><text x="142" y="190" text-anchor="middle" fill="#c4b5fd">React</text>
    <rect x="184" y="172" width="93" height="27" rx="13" fill="#34d399" fill-opacity=".15"/><text x="230" y="190" text-anchor="middle" fill="#6ee7b7">TypeScript</text>
    <rect x="285" y="172" width="55" height="27" rx="13" fill="#ec4899" fill-opacity=".15"/><text x="312" y="190" text-anchor="middle" fill="#f9a8d4">MDX</text>
  </g>
  <text x="28" y="238" fill="#c4b5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">EXPLORE THE ARCHIVE →</text>
