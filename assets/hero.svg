<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Abhiram Bhogi — Software Engineer</title>
  <desc id="desc">A midnight terminal-inspired banner with violet and orange accents for Abhiram Bhogi, a software engineer working across AI, full-stack systems, and infrastructure.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070913"/>
      <stop offset="0.52" stop-color="#101127"/>
      <stop offset="1" stop-color="#180d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="48" y="42" width="1104" height="336" rx="25"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <circle cx="220" cy="80" r="280" fill="url(#violetGlow)"/>
  <circle cx="1080" cy="360" r="310" fill="url(#orangeGlow)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>

  <g clip-path="url(#panelClip)">
    <rect x="48" y="42" width="1104" height="336" rx="25" fill="#090b17" fill-opacity="0.68" stroke="#a78bfa" stroke-opacity="0.3"/>
    <rect x="48" y="42" width="1104" height="48" fill="#111328" fill-opacity="0.92"/>
    <circle cx="78" cy="66" r="6" fill="#ff6b35"/>
    <circle cx="99" cy="66" r="6" fill="#fbbf24"/>
    <circle cx="120" cy="66" r="6" fill="#34d399"/>
    <text x="600" y="72" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">abhiram@github ~ /profile</text>

    <g opacity="0.72" stroke-linecap="round">
      <path d="M875 145L963 118L1052 157L997 230L1090 282L1008 330L916 291L846 331" fill="none" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M875 145L916 291M963 118L997 230M1052 157L1090 282M997 230L916 291M997 230L1008 330" fill="none" stroke="#ff6b35" stroke-opacity="0.38" stroke-width="1.2"/>
      <g fill="#c4b5fd" filter="url(#softGlow)">
        <circle cx="875" cy="145" r="4"/><circle cx="963" cy="118" r="4"/><circle cx="1052" cy="157" r="4"/><circle cx="997" cy="230" r="5"/><circle cx="1090" cy="282" r="4"/><circle cx="1008" cy="330" r="4"/><circle cx="916" cy="291" r="4"/><circle cx="846" cy="331" r="4"/>
      </g>
    </g>

    <text x="94" y="136" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">HELLO, I’M</text>
    <text x="90" y="211" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">ABHIRAM BHOGI</text>
    <rect x="94" y="231" width="590" height="3" rx="2" fill="url(#accent)"/>
    <text x="94" y="273" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600">SOFTWARE ENGINEER · AI/ML · FULL-STACK · INFRASTRUCTURE</text>
    <text x="94" y="325" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; building intelligent, observable systems</text>
    <rect x="549" y="306" width="10" height="23" rx="1" fill="#ff6b35">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="48" y="42" width="1104" height="336" rx="25" fill="none" stroke="url(#accent)" stroke-opacity="0.5"/>
</svg>
