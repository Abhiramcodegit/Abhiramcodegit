<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">Let's build something useful</title><desc id="desc">An invitation to connect with Abhiram about software engineering, AI, infrastructure, and new ideas.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#100d24"/><stop offset=".5" stop-color="#0a1020"/><stop offset="1" stop-color="#21100f"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff6b35"/></linearGradient></defs><rect width="1200" height="210" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="208" rx="27" fill="none" stroke="url(#a)" stroke-width="2"/><text x="600" y="66" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">OPEN TO IDEAS · COLLABORATION · CONVERSATION</text><text x="600" y="113" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="800">Let’s build something useful.</text><text x="600" y="151" text-anchor="middle" fill="#d1d5db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">Software engineering · AI systems · infrastructure · everything we learn along the way</text><text x="600" y="184" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="13">thanks for stopping by — there’s always something worth building</text></svg>