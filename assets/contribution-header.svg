<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Contribution Signal</title>
  <desc id="desc">A styled section header for Abhiram's live GitHub contribution activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080a16"/>
      <stop offset=".55" stop-color="#110d21"/>
      <stop offset="1" stop-color="#21100f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#c4b5fd" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="150" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="150" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="148" rx="25" fill="none" stroke="url(#accent)" stroke-opacity=".72" stroke-width="2"/>
  <rect x="48" y="28" width="182" height="25" rx="12.5" fill="#8b5cf6" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".45"/>
  <circle cx="64" cy="40.5" r="4" fill="#34d399" filter="url(#glow)"/>
  <text x="78" y="45" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.8">LIVE GITHUB ACTIVITY</text>
  <text x="48" y="102" fill="#f9fafb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="36" font-weight="800">Contribution Signal</text>
  <text x="404" y="101" fill="#9ca3af" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">real work · real commits · always updating</text>
  <g transform="translate(1000 50)">
    <path d="M0 39 C22 39 25 13 48 13 S74 55 98 55 S124 28 150 28" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="39" r="5" fill="#8b5cf6"/>
    <circle cx="48" cy="13" r="5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="98" cy="55" r="5" fill="#ff6b35"/>
    <circle cx="150" cy="28" r="5" fill="#ff6b35" filter="url(#glow)"/>
  </g>
  <rect x="48" y="123" width="1104" height="2" rx="1" fill="url(#accent)" fill-opacity=".72"/>
</svg>
